                  options: [

                      { text: 'Ligar para a mesa de som no rádio e pedir para cortarem o canal e ativarem o microfone da plateia.', cons: 'O áudio é restaurado via mesa, mantendo a postura invisível da equipe.', imp: { equipe: 2, organizacao: 2 }, feedback: 'Resolução técnica eficiente nos bastidores.' },
                      { text: 'Subir ao palco, pedir desculpas com humor e arrumar o cabo do equipamento original.', cons: 'O público ri, o clima descomplica e a palestra volta descontraída.', imp: { empatia: 2, hospede: 2 }, feedback: 'Quebra-gelo empático e gestão de crise humana.' }
                  ], pedag: 'Falha Técnica ao Vivo.' },
                { time: '14:00', context: 'Recepção Eventos.', problem: 'Esperavam 50 pessoas. Apareceram 70. Faltam cadeiras e o coffee break vai ser curto.',
                  options: [
                      { text: 'Acomodar os 20 extras no fundo com cadeiras do restaurante e já avisar a cozinha do aumento.', cons: 'Ninguém fica em pé e a cozinha garante a comida.', imp: { eficiencia: 3, equipe: 2 }, feedback: 'Ação rápida de expansão de capacidade.' },
                      { text: 'Chamar o cliente em particular, assinar o aditivo de 20 pessoas e autorizar a liberação geral.', cons: 'Garante que as 20 pessoas a mais serão faturadas (aumento de receita).', imp: { organizacao: 3, risco: 2 }, feedback: 'Foco no faturamento e formalização de serviços (Upselling).' },
                      { text: 'Colocar mesas bistrô (altas) no fundo e vender o evento como um formato "Híbrido e Dinâmico".', cons: 'As pessoas aceitam ficar em pé achando que é o estilo do evento.', imp: { criatividade: 3, qualidade: 1 }, feedback: 'Reenquadramento criativo (framing) do problema.' }
                  ], pedag: 'Aumento de Lotação (Walk-in).' },
                { time: '15:30', context: 'Logística.', problem: 'O congresso atrasou. Você tem apenas 40 minutos para desmontar a sala e montar um Casamento à noite.',
                  options: [
                      { text: 'Fazer um corredor humano com as equipes de Limpeza e Eventos para retirar e colocar móveis juntos.', cons: 'A sala é transformada de Auditório para Casamento em exatos 35 minutos.', imp: { equipe: 3, eficiencia: 3 }, feedback: 'Operação de "Virada de Sala" (Turnaround) em nível de excelência.' },
                      { text: 'Pedir à noiva para servir os welcome drinks no jardim do hotel (cortesia) até a sala ficar pronta.', cons: 'A noiva fica feliz com a cortesia e a equipe tem tempo para montar a sala.', imp: { hospede: 3, flexibilidade: 2 }, feedback: 'Gestão de tempo aliada ao encantamento de cliente VIP.' },
                      { text: 'Focar na montagem das mesas principais e iluminação, escondendo o resto atrás de cortinas pesadas.', cons: 'A festa começa no visual perfeito, enquanto vocês terminam o fundo.', imp: { organizacao: 2, criatividade: 2 }, feedback: 'Ilusionismo logístico focado na "primeira impressão".' }
                  ], pedag: 'Tempo de Montagem (Turnaround).' },
                { time: '16:45', context: 'Visita Técnica.', problem: 'Uma cliente corporativa faz visita técnica no hotel e reclama que o pé-direito (altura) da sala é baixo.',
                  options: [
                      { text: 'Mostrar fotos em iPad de eventos anteriores mostrando como a iluminação cênica amplia o salão.', cons: 'A cliente consegue visualizar e perde o medo da altura do teto.', imp: { qualidade: 3, eficiencia: 2 }, feedback: 'Uso de material visual (case de sucesso) para quebrar objeções.' },
                      { text: 'Oferecer outro salão no térreo que tem o teto mais alto, mesmo sendo um pouco mais caro.', cons: 'Ela fecha o outro salão. Você fez um upselling inteligente.', imp: { organizacao: 2, flexibilidade: 2 }, feedback: 'Redirecionamento focado nas necessidades (Venda Consultiva).' },
                      { text: 'Destacar fortemente outras qualidades: "O teto é assim para garantir a melhor acústica da cidade".', cons: 'Transforma o "defeito" em um super diferencial técnico (acústica).', imp: { criatividade: 3, equipe: 1 }, feedback: 'Argumentação de vendas avançada.' }
                  ], pedag: 'Vendas e Objeções.' },
                { time: '18:00', context: 'Foyer.', problem: 'Grupo corporativo gringo pede uma TV grande no hall para passar o jogo do seu país agora.',
                  options: [
                      { text: 'Pedir 10 minutos para a equipe AV buscar uma TV de 60" no depósito e montar no tripé no hall.', cons: 'O grupo se reúne em volta da TV e comemora. O cliente fica impressionado.', imp: { hospede: 3, eficiencia: 2 }, feedback: 'Hospitalidade de alto nível baseada em agilidade técnica.' },
                      { text: 'Negociar que eles assistam no telão principal de um salão menor que está vazio e com som.', cons: 'Eles ganham uma "sala de cinema VIP" e não obstruem o hall.', imp: { organizacao: 3, qualidade: 2 }, feedback: 'Otimização inteligente dos espaços ociosos do hotel.' },
                      { text: 'Oferecer que vão ao Sports Bar do hotel, garantindo que o garçom coloque no canal certo.', cons: 'O grupo consome cerveja no bar, aumentando a receita de A&B.', imp: { equipe: 2, flexibilidade: 2 }, feedback: 'Sinergia entre setores para gerar receita adicional.' }
                  ], pedag: 'Atendimento Personalizado.' },
                { time: '19:30', context: 'BEO (Ordem de Serviço).', problem: 'A BEO informa "Jantar Empratado", mas o cliente diz que o combinado verbal foi "Buffet".',
                  options: [
                      { text: 'Acreditar no cliente, correr para a cozinha e pedir para converterem as guarnições em Buffet rápido.', cons: 'O Chef reage rápido. O cliente percebe que o hotel foca na solução.', imp: { equipe: 3, eficiencia: 2 }, feedback: 'Priorizou a confiança no cliente e a flexibilidade da operação.' },
                      { text: 'Conferir o e-mail de fechamento rápido. Estava Buffet. Assumir o erro do BEO e trocar tudo.', cons: 'Resolução honesta que fortalece a confiança contratual.', imp: { organizacao: 3, risco: 2 }, feedback: 'Validação documental (Compliance) e correção assertiva.' },
                      { text: 'Oferecer um "Empratado de Gala" com porções duplas para não ter que desmontar o salão inteiro.', cons: 'O cliente adora a proposta de "Gala" e aceita manter o empratado.', imp: { criatividade: 3, qualidade: 2 }, feedback: 'Excelente habilidade de negociação e contorno.' }
                  ], pedag: 'Divergência BEO.' },
                { time: '21:00', context: 'Festa.', problem: 'A festa da empresa está animada, mas deu 22h, limite de som contratado, e o DJ não quer parar.',
                  options: [
                      { text: 'Chamar o diretor da empresa, explicar a regra e pedir para ele autorizar baixar o volume 50%.', cons: 'A festa continua como "lounge", respeitando o descanso do hotel.', imp: { risco: 3, organizacao: 2 }, feedback: 'Excelente articulação diplomática e respeito às leis do silêncio.' },
                      { text: 'Oferecer que a equipe continue no bar do hotel (que tem isolamento acústico) por mais 1 hora.', cons: 'A festa se muda para o bar, gerando receita e parando o barulho.', imp: { hospede: 2, eficiencia: 3 }, feedback: 'Redirecionamento tático focando em experiência e receita.' },
                      { text: 'Acionar a equipe de manutenção para focar o som das caixas apenas para o centro da pista.', cons: 'O volume geral cai e o som fica concentrado onde importa.', imp: { equipe: 2, qualidade: 2 }, feedback: 'Solução técnica inteligente para equalizar a satisfação.' }
                  ], pedag: 'Limite de Horário/Som.' }
            ],
            lazer: [
                { time: '09:00', context: 'Programação.', problem: 'Choveu e o "Futebol de Sabão" externo foi cancelado. Você tem 30 crianças no lobby esperando.',
                  options: [
                      { text: 'Transferir todos para o salão de jogos e organizar um campeonato de ping-pong/pebolim relâmpago.', cons: 'As crianças esquecem a chuva e a gritaria vira torcida no salão.', imp: { eficiencia: 3, hospede: 2 }, feedback: 'Acionou um Plano B logístico com extrema agilidade.' },
                      { text: 'Fazer uma "Sessão de Cinema" na sala de eventos com pipoca (pedida para a cozinha).', cons: 'Crianças calmas, ambiente seguro e pipoca garantindo a alegria.', imp: { equipe: 2, qualidade: 2 }, feedback: 'Uso de áreas livres do hotel para entretenimento passivo e sinergia (A&B).' },
                      { text: 'Organizar uma "Gincana de Caça ao Tesouro Interna" pelos corredores sem atrapalhar os hóspedes.', cons: 'A aventura continua sendo dinâmica e gasta a energia deles.', imp: { criatividade: 3, qualidade: 2 }, feedback: 'Adaptação criativa de atividades de alto impacto.' }
                  ], pedag: 'Plano B (Clima).' },
                { time: '10:30', context: 'Recreação.', problem: 'Um menino não quer brincar na roda com os outros e está chorando num canto, querendo o pai.',
                  options: [
                      { text: 'Sentar ao lado dele, oferecer massinha de modelar e fazer companhia até ele se acalmar.', cons: 'Ele relaxa com uma atividade solo e a roda principal continua.', imp: { empatia: 3, hospede: 2 }, feedback: 'Extrema sensibilidade, inclusão e atendimento individualizado.' },
                      { text: 'Mudar a atividade da roda toda para algo que ele confessou gostar (ex: Desenhar super-heróis).', cons: 'Ele se integra imediatamente por ver seu tema favorito.', imp: { flexibilidade: 3, qualidade: 2 }, feedback: 'Leitura do público e flexibilidade do planejamento (Pivotar).' },
                      { text: 'Avisar os pais pelo WhatsApp oficial com tranquilidade para que venham conversar com ele.', cons: 'Os pais resolvem, a transparência gera confiança na equipe.', imp: { organizacao: 2, risco: 2 }, feedback: 'Boa comunicação e respeito à guarda compartilhada.' }
                  ], pedag: 'Gestão Emocional Infantil.' },
                { time: '12:00', context: 'Piscina.', problem: 'Atividade de "Hidroginástica com DJ". Hóspedes mais velhos reclamam do volume do som.',
                  options: [
                      { text: 'Reduzir o volume da música na hora, mas compensar animando muito mais no microfone.', cons: 'A hidro continua forte pela sua voz e os idosos conseguem ler.', imp: { empatia: 3, qualidade: 2 }, feedback: 'Habilidade de compensar energia sem o recurso (som).' },
                      { text: 'Oferecer aos idosos um gazebo VIP mais distante e tranquilo para eles lerem em paz.', cons: 'Eles amam o upgrade de conforto. A música da piscina continua alta.', imp: { hospede: 3, eficiencia: 2 }, feedback: 'Encantamento (upgrade de experiência) focado em contornar conflitos.' },
                      { text: 'Dividir a piscina em "Área Zen" e "Área Agito" usando as boias de raia do hotel.', cons: 'Delimita o espaço físico e organiza as expectativas dos dois grupos.', imp: { organizacao: 3, risco: 2 }, feedback: 'Gestão visual e física dos espaços comuns.' }
                  ], pedag: 'Conflito de Perfis.' },
                { time: '14:00', context: 'Kids Club.', problem: 'A sala de brinquedos lotou (atingiu a capacidade máxima por lei), mas há 5 famílias na porta.',
                  options: [
                      { text: 'Explicar a lei de segurança dos bombeiros com gentileza e abrir uma "Fila de Espera" no tablet.', cons: 'Os pais respeitam a norma técnica e aguardam em segurança.', imp: { risco: 3, organizacao: 3 }, feedback: 'Cumprimento estrito de normas de segurança.' },
                      { text: 'Chamar um monitor reserva e criar uma "Turma de Passeio no Jardim" com 10 crianças de dentro.', cons: 'Abre 10 vagas instantâneas na sala e todos são atendidos.', imp: { eficiencia: 3, equipe: 2 }, feedback: 'Otimização de fluxo e alocação de recursos humanos.' },
                      { text: 'Oferecer kits de pintura "Leve para o Quarto" para as 5 crianças que não puderam entrar.', cons: 'As crianças saem com um presente, mitigando a frustração.', imp: { hospede: 2, criatividade: 2 }, feedback: 'Gestão de filas utilizando ferramentas de distração (gifts).' }
                  ], pedag: 'Lotação Máxima (Segurança).' },
                { time: '15:30', context: 'Esportes.', problem: 'Dois adolescentes se desentendem num jogo de vôlei organizado pelo hotel e começam a gritar.',
                  options: [
                      { text: 'Apitar forte, interromper o jogo e colocar os dois sentados fora de quadra para "esfriar".', cons: 'A autoridade do juiz é mantida e o jogo volta ao normal sem violência.', imp: { lideranca: 3, risco: 2 }, feedback: 'Uso de autoridade de campo e gestão imediata de conflito.' },
                      { text: 'Mudar a regra do jogo na hora para "quem brigar perde 5 pontos pro time", usando humor.', cons: 'Eles riem, os times se cobram e o clima fica amigável de novo.', imp: { criatividade: 3, empatia: 2 }, feedback: 'Contorno de crise através do lúdico e da gamificação.' },
                      { text: 'Chamar o segurança do hotel discretamente para ficar na beira da quadra apenas observando.', cons: 'A presença do segurança inibe brigas maiores e o jogo segue.', imp: { equipe: 2, risco: 3 }, feedback: 'Escalonamento inteligente e prevenção de danos físicos.' }
                  ], pedag: 'Mediação no Lazer.' },
                { time: '16:45', context: 'Parceria.', problem: 'A Oficina de Cupcakes ia começar, mas a Cozinha mandou os bolinhos crus por engano.',
                  options: [
                      { text: 'Mudar a atividade para "Aventura na Cozinha", levando as crianças para verem o forno assando.', cons: 'Elas amam o tour VIP e não percebem que foi um erro de logística.', imp: { equipe: 3, criatividade: 3 }, feedback: 'Transformou um erro grave em uma experiência exclusiva (Sinergia).' },
                      { text: 'Correr no rádio, pedir bolinhos prontos do estoque do refeitório enquanto finge uma "mágica".', cons: 'Os bolos chegam e você salva a atividade com improviso rápido.', imp: { eficiencia: 3, flexibilidade: 2 }, feedback: 'Resolução ultra-rápida (Plano B Logístico).' },
                      { text: 'Adiar a oficina em 30 mins e oferecer pintura facial na fila de espera enquanto assam.', cons: 'Você ganha tempo oficial para a cozinha corrigir a falha sem pressa.', imp: { organizacao: 2, qualidade: 2 }, feedback: 'Gerenciamento de prazos intersetoriais com atividade "tapa-buraco".' }
                  ], pedag: 'Sinergia e Falhas.' },
                { time: '17:30', context: 'Lobby.', problem: 'Casal de idosos comenta que as atividades do hotel são "só para os jovens".',
                  options: [
                      { text: 'Organizar imediatamente uma aula de "Degustação de Chás e Histórias do Hotel" na lareira.', cons: 'Eles e outros idosos participam, adoram e se sentem prestigiados.', imp: { hospede: 3, criatividade: 3 }, feedback: 'Criação de experiência hiper-direcionada para o nicho (Hospitalidade).' },
                      { text: 'Apresentar a programação de "Caminhada Zen Matinal" e agendar eles como VIPs de amanhã.', cons: 'Eles veem que há opções estruturadas e ficam na expectativa.', imp: { organizacao: 2, qualidade: 2 }, feedback: 'Comunicação assertiva da grade de programação.' },
                      { text: 'Falar com o bar para prepararem dois drinks clássicos cortesia para eles curtirem o pôr do sol.', cons: 'Compensa a falta de atividades com mimos gastronômicos.', imp: { equipe: 2, empatia: 2 }, feedback: 'Uso de A&B (Alimentos e Bebidas) para encantar perfis difíceis.' }
                  ], pedag: 'Atendimento de Perfis Diferentes.' },
                { time: '19:00', context: 'Show Noturno.', problem: 'O cantor de voz e violão do lobby cancelou faltando 1 hora para começar.',
                  options: [
                      { text: 'Assumir o microfone, organizar um "Karaokê Interativo dos Hóspedes" no palco.', cons: 'O lobby fica mais lotado e divertido do que se o cantor viesse.', imp: { eficiencia: 3, lideranca: 3 }, feedback: 'Atitude protagonista: "O show tem que continuar" (Showmanship).' },
                      { text: 'Acionar um DJ local parceiro do hotel que cobra mais caro, mas chega em 30 minutos.', cons: 'A noite é salva com um profissional excelente. A gerência aprova.', imp: { qualidade: 3, equipe: 2 }, feedback: 'Rede de contatos e rápida aprovação orçamentária para crises.' },
                      { text: 'Colocar uma playlist de Jazz de alta qualidade, diminuir a luz e mudar o foco para o Barman fazer shows com garrafas.', cons: 'Transforma o clima da noite numa pegada mais lounge e sofisticada.', imp: { criatividade: 3, organizacao: 2 }, feedback: 'Direção de arte e adaptação de clima.' }
                  ], pedag: 'Falta de Terceiros.' },
                { time: '20:30', context: 'Feedback.', problem: 'Ouvindo hóspedes, você descobre que um dos monitores está sempre no celular durante as atividades.',
                  options: [
                      { text: 'Chamar o monitor em particular, dar o feedback imediatamente e pedir que guarde o celular no cofre.', cons: 'Ele corrige a postura na mesma hora e os hóspedes percebem.', imp: { lideranca: 3, equipe: 2 }, feedback: 'Feedback corretivo e de alinhamento imediato.' },
                      { text: 'Avisar o Coordenador de Lazer para que o feedback venha oficialmente pela hierarquia superior.', cons: 'Mantém a estrutura de comando e o registro formal de RH.', imp: { organizacao: 3, risco: 2 }, feedback: 'Respeito à hierarquia formal.' },
                      { text: 'Criar uma "Caixa do Desapego Digital" onde toda a equipe e crianças deixam os celulares.', cons: 'Transforma o erro individual numa regra de ouro divertida para todos.', imp: { criatividade: 3, empatia: 2 }, feedback: 'Solução sistêmica que muda a cultura do setor (Gamificação).' }
                  ], pedag: 'Feedback e Postura.' },
                { time: '21:45', context: 'Encerramento.', problem: 'A sala de artes terminou com tinta espalhada no chão e mesas. O turno da Limpeza já foi embora.',
                  options: [
                      { text: 'Reunir sua equipe, colocar música e fazer um "Mutirão da Limpeza" de 15 minutos juntos.', cons: 'A sala fica limpa. O material de pintura é salvo para amanhã.', imp: { equipe: 3, organizacao: 3 }, feedback: 'Excelência em organização e responsabilidade (Ownership).' },
                      { text: 'Limpar apenas os pincéis e potes para não secarem, e deixar o chão para a camareira amanhã.', cons: 'Salva o material caro, otimizando seu horário de saída.', imp: { eficiencia: 2, flexibilidade: 2 }, feedback: 'Pragmatismo: priorizou o patrimônio e deixou a estrutura para limpeza.' },
                      { text: 'Fazer um acordo com o Mensageiro noturno para ele ajudar em troca de um lanche do Lazer.', cons: 'Comunicação e barganha interna para resolver problemas operacionais.', imp: { equipe: 2, eficiencia: 2 }, feedback: 'Habilidade de negociação com a operação noturna.' }
                  ], pedag: 'Organização de Retaguarda.' }
            ],
            admin: [
                { time: '09:00', context: 'Contas a Pagar.', problem: 'Nota Fiscal de fornecedor chegou R$ 2.000 maior que o Orçamento (Pedido) aprovado no sistema.',
                  options: [
                      { text: 'Segurar o pagamento, ligar para o fornecedor e exigir a correção e reemissão da Nota Fiscal.', cons: 'Descobre-se um erro de digitação do fornecedor. O hotel economiza R$ 2 mil.', imp: { organizacao: 3, risco: 3 }, feedback: 'Excelente auditoria e proteção do fluxo de caixa (Compliance).' },
                      { text: 'Procurar o Chefe de Compras para entender se houve algum pedido extra (aditivo) não lançado.', cons: 'Houve aditivo. O sistema é atualizado e o pagamento segue correto.', imp: { equipe: 2, qualidade: 2 }, feedback: 'Investigação e alinhamento intersetorial antes de barrar processos.' },
                      { text: 'Pagar o valor do orçamento e descontar os 2 mil no depósito bancário (pagamento parcial).', cons: 'Hotel paga só o que deve, mas gera conciliação bancária confusa depois.', imp: { eficiencia: 2, risco: 1 }, feedback: 'Ação ágil e pragmática, mas com menor qualidade contábil.' }
                  ], pedag: 'Divergência de Valores.' },
                { time: '10:15', context: 'Urgência.', problem: 'A Recepção pede R$ 300 do "Caixa Pequeno" urgente para devolver a um hóspede furioso (erro de cobrança).',
                  options: [
                      { text: 'Preencher um recibo de Vale Caixa, correr na recepção, colher assinatura e entregar o dinheiro.', cons: 'O hóspede é atendido rápido e o caixa da administração fica acobertado.', imp: { eficiencia: 3, organizacao: 2 }, feedback: 'Agilidade na resolução associada a controle documental.' },
                      { text: 'Explicar que devoluções são só via Pix em até 2 dias úteis, conforme a política financeira.', cons: 'O caixa fica intocável, mas o hóspede fica mais irritado no lobby.', imp: { risco: 2, organizacao: 2 }, feedback: 'Adesão rigorosa e inflexível às políticas financeiras.' },
                      { text: 'Fazer o Pix da conta do hotel pelo celular administrativo diretamente para a conta do hóspede.', cons: 'Rápido, seguro e moderno. Evita trânsito de espécie.', imp: { qualidade: 3, eficiencia: 2 }, feedback: 'Modernização do fluxo financeiro usando tecnologia.' }
                  ], pedag: 'Urgência Financeira.' },
                { time: '11:30', context: 'Compras.', problem: 'Estoque de café acabou! O fornecedor principal só entrega amanhã e o hotel tem evento às 14h.',
                  options: [
                      { text: 'Pegar o carro da empresa ou Uber, ir ao supermercado atacadista e comprar café para 2 dias.', cons: 'O evento acontece perfeitamente com café fresco. A nota é reembolsada.', imp: { eficiencia: 3, resolucao: 3 }, feedback: 'Prontidão logística extrema para não deixar faltar insumos.' },
                      { text: 'Emprestar pacotes de café de um hotel vizinho da mesma rede ou parceiro.', cons: 'O café chega a custo zero momentâneo. Networking da hotelaria funciona.', imp: { equipe: 3, criatividade: 2 }, feedback: 'Uso de relacionamento inter-hoteleiro (Benchmarking solidário).' },
                      { text: 'Acionar a cozinha para processarem cápsulas expressas ou solúvel premium como plano B.', cons: 'O café sai, mas o custo por xícara aumenta devido ao insumo diferente.', imp: { qualidade: 2, organizacao: 1 }, feedback: 'Uso dos recursos alternativos disponíveis internamente.' }
                  ], pedag: 'Falta de Estoque Emergencial.' },
                { time: '14:00', context: 'Sistemas.', problem: 'É dia 05, pagamento de salários. O token do banco corporativo está travado (falha do banco).',
                  options: [
                      { text: 'Ligar no gerente do banco no celular particular dele e exigir liberação de contingência manual.', cons: 'O gerente faz a liberação nos bastidores e a folha é paga até às 17h.', imp: { eficiencia: 3, risco: 3 }, feedback: 'Uso agressivo (e necessário) do relacionamento bancário executivo.' },
                      { text: 'Disparar um e-mail oficial para toda a equipe explicando o problema do banco e dando previsão.', cons: 'A equipe fica calma por causa da transparência, evitando rádio peão.', imp: { equipe: 2, empatia: 2 }, feedback: 'Gestão de comunicação interna impecável em momento de crise.' },
                      { text: 'Fazer o pagamento em lotes menores (TED) usando outra conta reserva do hotel que está ativa.', cons: 'O salário entra. O banco cobra taxas de TED, mas o compromisso é honrado.', imp: { flexibilidade: 3, organizacao: 2 }, feedback: 'Ação rápida de desvio de fluxo financeiro para contas de backup.' }
                  ], pedag: 'Pagamento Crítico e Falha.' },
                { time: '15:15', context: 'Faturamento.', problem: 'Uma OTA (Agência Online) gigante não enviou os relatórios de comissão, impedindo o hotel de faturar (receber).',
                  options: [
                      { text: 'Bloquear a OTA (Stop Sell) no sistema do hotel até que eles enviem o relatório.', cons: 'A agência nota o bloqueio, envia o relatório em 10 minutos.', imp: { organizacao: 3, risco: 2 }, feedback: 'Alavancagem comercial dura, mas eficaz (Hard Negotiation).' },
                      { text: 'Emitir as Notas Fiscais com base no relatório interno do hotel e cobrar a agência pelos nossos dados.', cons: 'Garante o fluxo de caixa do hotel pela nossa própria base de auditoria.', imp: { eficiencia: 3, qualidade: 2 }, feedback: 'Confiança na própria auditoria e proatividade no faturamento.' },
                      { text: 'Escalar o problema para o Diretor Geral falar com o Diretor da OTA, usando peso hierárquico.', cons: 'A diretoria resolve no networking, mantendo a relação de parceria forte.', imp: { equipe: 2, organizacao: 2 }, feedback: 'Escalonamento político (Escalation process) adequado.' }
                  ], pedag: 'Faturamento B2B.' },

                        <div className="max-w-xl mx-auto space-y-6">
                            
                            {/* Card de Perfil - IA Gerada */}
                            <div className={`bg-gradient-to-br ${profile.color} rounded-3xl p-6 text-white text-center shadow-xl relative overflow-hidden mt-4`}>
                                <div className="absolute opacity-10 right-[-20%] top-[-20%]">
                                    <StarIcon size={200} />
                                </div>
                                <div className="relative z-10 flex flex-col items-center">
                                    <div className="bg-white/20 p-2 rounded-full mb-3 backdrop-blur-sm border-2 border-white/40">
                                        <img src={avatarUrl} alt="Avatar de IA" className="w-24 h-24 rounded-full bg-white shadow-inner" />
                                    </div>
                                    <p className="text-xs uppercase tracking-widest font-bold text-white/80 mb-1">Seu Perfil Hoje</p>
                                    <h1 className="text-3xl font-black mb-1">{profile.title}</h1>
                                    <p className="text-sm font-medium">{profile.desc}</p>
                                    <p className="text-[10px] mt-4 opacity-70 bg-black/20 px-3 py-1 rounded-full inline-block">AVATAR IA GERADO COM BASE NAS SUAS DECISÕES</p>
                                </div>
                            </div>

                            {/* Desempenho Visual */}
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                <h2 className="text-sm font-black text-slate-800 uppercase tracking-widest mb-4">Indicadores da Simulação</h2>
                                <div className="space-y-3">
                                    {indicators.map(ind => (
                                        <div key={ind.key} className="flex items-center justify-between">
                                            <span className="text-sm font-semibold text-slate-600">{ind.label}</span>
                                            <div className="flex gap-1 text-yellow-400">
                                                {[...Array(5)].map((_, i) => (
                                                    <svg key={i} className={`w-4 h-4 ${i < getStars(scores[ind.key]) ? 'fill-current' : 'text-slate-200 fill-current'}`} viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Destaques */}
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                <h2 className="text-sm font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2"><CheckIcon size={16} className="text-green-500"/> O que você fez bem</h2>
                                <ul className="space-y-3">
                                    {goodFeedbacks.length > 0 ? goodFeedbacks.map((f, i) => (
                                        <li key={i} className="text-sm font-medium text-slate-600 flex gap-2"><span className="text-green-500 mt-0.5">•</span> <span>{f}</span></li>
                                    )) : <li className="text-sm text-slate-500 italic">O turno foi muito tenso e focado em manter a operação sem quebras severas.</li>}
                                </ul>
                            </div>

                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                <h2 className="text-sm font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2"><AlertIcon size={16} className="text-orange-500"/> Desenvolver</h2>
                                <ul className="space-y-3">
                                    {badFeedbacks.length > 0 ? badFeedbacks.map((f, i) => (
                                        <li key={i} className="text-sm font-medium text-slate-600 flex gap-2"><span className="text-orange-400 mt-0.5">•</span> <span>{f}</span></li>
                                    )) : <li className="text-sm text-slate-500 italic">Ótima performance nas resoluções críticas do turno.</li>}
                                </ul>
                            </div>

                            {/* Desafio Final */}
                            <div className="bg-slate-800 p-6 rounded-3xl shadow-sm text-center text-white">
                                <h2 className="text-xs font-black uppercase tracking-widest mb-2 text-blue-400">🏆 Seu Próximo Desafio</h2>
                                <p className="text-sm">"Tente observar como uma decisão isolada no seu setor causa um efeito dominó em todo o hotel."</p>
                            </div>

                            {/* Ações */}
                            <div className="flex flex-col gap-3 pt-4">
                                <button onClick={handleShareWhatsApp} className="w-full bg-blue-100 text-blue-700 font-bold py-4 px-4 rounded-2xl active:bg-blue-200 transition text-sm flex items-center justify-center gap-2">
                                    <ShareIcon size={18}/> COMPARTILHAR RESULTADO
                                </button>
                                <button onClick={() => startShift(sector.id)} className="w-full bg-white text-slate-800 border border-slate-300 font-bold py-4 px-4 rounded-2xl active:bg-slate-50 transition text-sm flex items-center justify-center gap-2">
                                    <RefreshIcon size={18}/> JOGAR MESMO SETOR
                                </button>
                                <button onClick={() => setGameState('SELECTION')} className="w-full bg-slate-800 text-white font-bold py-4 px-4 rounded-2xl active:bg-slate-700 transition text-sm flex items-center justify-center gap-2">
                                    <BriefcaseIcon size={18}/> ESCOLHER OUTRO SETOR
                                </button>
                                <button onClick={() => setGameState('START')} className="w-full bg-slate-200 text-slate-700 font-bold py-4 px-4 rounded-2xl active:bg-slate-300 transition text-sm flex items-center justify-center gap-2">
                                    <HomeIcon size={18}/> VOLTAR PARA O INÍCIO
                                </button>
                            </div>

                        </div>
                    </div>
                );
            };

            switch(gameState) {
                case 'START': return renderStart();
                case 'SELECTION': return renderSelection();
                case 'PREP': return renderPrep();
                case 'PLAYING': return renderPlaying();
                case 'END': return renderEndAnim();
                case 'REPORT': return renderReport();
                default: return renderStart();
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
